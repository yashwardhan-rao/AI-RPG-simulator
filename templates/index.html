<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Simulator</title>

    <style>
        body {
            background-color: #1a1a24;
            color: #f0f0f0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            width: 800px;
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            line-height: 1.6;
        }
        .user-msg {
            color: #4dabf7;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .ai-msg {
            color: #fff;
            margin-bottom: 25px;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 16px;
        }
        button {
            padding: 15px 30px;
            background: #4dabf7;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #3b8bc6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top: 0;">Version 1: Static Interface</h2>
        <p style="color: #aaa; margin-top: -10px;">This is just the beginning</p>

        <div id="chat-box" class="chat-history">
            <div class="ai-msg">Welcome to the game.</div>
        </div>

        <form id="action-form" class="input-area">
            <input type="text" id="action-input" placeholder="type your action here..." autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('action-form');
        const input = document.getElementById('action-input');
        const chatBox = document.getElementById('chat-box');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const text = input.value.trim();
            if (text === "") return;

            chatBox.innerHTML += `<div class="user-msg">> You: ${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/action", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ action: text })
                });

                const data = await response.json();

                chatBox.innerHTML += `<div class="ai-msg">${data.reply}<div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                input.value = "";
            } catch (error) {
                console.error("Error communicating with Python:", error);
                chatBox.innerHTML += `<div class="ai-msg" styles="color:red;">Error connecting to Python server.</div>`;
            }
        });
    </script>
</body>
</html>
